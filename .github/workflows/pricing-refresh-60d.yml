name: Pricing Refresh — 60-day cadence

# Runs every 60 days at 09:07 UTC. GitHub Actions cron has no native "every 60 days"
# expression — using day-of-month 1 plus an alternating-month filter via the workflow
# itself. We simply run on the 1st of every other month (Jan, Mar, May, Jul, Sep, Nov)
# at off-peak minute 7 to avoid the GitHub-cron herd at :00.
on:
  schedule:
    - cron: '7 9 1 1,3,5,7,9,11 *'
  workflow_dispatch:  # allow manual triggering

permissions:
  issues: write
  contents: read

jobs:
  open-refresh-issue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Open pricing-refresh issue
        uses: actions/github-script@v7
        with:
          script: |
            const providers = [
              { name: 'DigitalOcean', url: 'https://www.digitalocean.com/pricing/droplets',  file: 'react-frontend/lib/pricing/digitalocean.ts' },
              { name: 'Linode',       url: 'https://www.linode.com/pricing/',                file: 'react-frontend/lib/pricing/linode.ts' },
              { name: 'Vultr',        url: 'https://www.vultr.com/pricing/',                 file: 'react-frontend/lib/pricing/vultr.ts' },
              { name: 'Render',       url: 'https://render.com/pricing',                     file: 'react-frontend/lib/pricing/render.ts' },
              { name: 'Railway',      url: 'https://railway.app/pricing',                    file: 'react-frontend/lib/pricing/railway.ts' },
              { name: 'Fly.io',       url: 'https://fly.io/docs/about/pricing/',             file: 'react-frontend/lib/pricing/fly.ts' },
            ]

            const today = new Date().toISOString().slice(0, 10)
            const checklist = providers.map(p =>
              `- [ ] **${p.name}** — verify [${p.url}](${p.url}) against \`${p.file}\``
            ).join('\n')

            const body = [
              `## Scheduled pricing refresh — ${today}`,
              ``,
              `These six providers update their pricing occasionally. Visit each URL, compare to the hardcoded table, and update if anything has changed.`,
              ``,
              checklist,
              ``,
              `### How to update`,
              `1. Open the file in the right column.`,
              `2. Update the prices and bump \`*_LAST_UPDATED\` to today's date.`,
              `3. Commit with message: \`chore: refresh pricing for [providers]\`.`,
              `4. Open a PR — verification cycle complete.`,
              ``,
              `### Or run with Claude Code`,
              `\`\`\``,
              `claude "verify and update pricing in lib/pricing/ for the 6 providers in issue #${process.env.ISSUE_REF || 'X'}"`,
              `\`\`\``,
              ``,
              `_Auto-generated by \`.github/workflows/pricing-refresh-60d.yml\`. Closes when PR merges._`,
            ].join('\n')

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Pricing refresh — 60-day cadence (${today})`,
              body,
              labels: ['pricing-refresh', 'maintenance'],
            })
